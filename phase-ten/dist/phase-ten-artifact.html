<title>Phase Ten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: a midnight game table; seats across the top, the deck and discard on a
   lit mat in the middle, your hand fanned in a dock pinned to the bottom. The four
   card colors are the only accents. */
:root {
  --bg: #120f33;
  --bg-2: #1b1748;
  --surface: #221d5a;
  --surface-2: #2c2670;
  --line: #3a3389;
  --ink: #f5f3ff;
  --muted: #a8a2dc;
  --red: #ff4d5e;
  --blue: #3d8bff;
  --green: #19c37d;
  --yellow: #ffc21a;
  --red-d: #c42a3a;
  --blue-d: #1f5fd1;
  --green-d: #0f8f59;
  --yellow-d: #d39a00;
  --shadow: #07051c;
  --display: "Bagel Fat One", "Arial Rounded MT Bold", "Arial Black", system-ui, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  --stripes: linear-gradient(90deg, var(--red) 0 25%, var(--blue) 25% 50%, var(--green) 50% 75%, var(--yellow) 75%);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  color: var(--ink);
  font: 15px/1.45 var(--body);
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse 90% 55% at 50% 30%, #2a2378 0%, transparent 70%),
    radial-gradient(circle, #ffffff10 1px, transparent 1.5px);
  background-size: 100% 100%, 22px 22px;
  background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
input {
  font: inherit;
  width: 100%;
  padding: 12px 14px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  font-weight: 500;
}
input::placeholder { color: #8079c0; }
input:focus { border-color: var(--yellow); outline: none; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

.wrap {
  max-width: 780px;
  margin: 0 auto;
  padding-block: 14px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.wrap:not(.screen-game) { padding-bottom: 40px; }
.wrap.busy { cursor: progress; }

h1, h2 { margin: 0; font-weight: 400; text-wrap: balance; }
h2 { font-family: var(--display); font-size: 20px; display: flex; align-items: center; gap: 8px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.lbl { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); margin-bottom: 4px; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; gap: 10px; align-items: flex-end; }
.count { font-family: var(--body); font-size: 13px; font-weight: 700; color: var(--muted); background: var(--bg); padding: 2px 8px; border-radius: 99px; }

/* ---------- buttons ---------- */
.btn {
  --b: var(--surface-2);
  --b-d: var(--shadow);
  border: 0;
  background: var(--b);
  border-radius: 14px;
  padding: 11px 18px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 0 var(--b-d);
  transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn:hover:not(:disabled) { filter: brightness(1.12); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--b-d); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { --b: var(--yellow); --b-d: var(--yellow-d); color: #2a1d00; }
.btn.go { --b: var(--green); --b-d: var(--green-d); color: #fff; }
.btn.danger { --b: var(--red); --b-d: var(--red-d); color: #fff; }
.btn.big { font-family: var(--display); font-weight: 400; font-size: 19px; padding: 14px 20px; border-radius: 18px; width: 100%; box-shadow: 0 5px 0 var(--b-d); }
.btn.bots { --b: var(--surface-2); --b-d: var(--shadow); font-size: 16px; }
.btn.bots svg { --seat: var(--surface-2); width: 22px; height: 22px; color: var(--ink); }
.btn .badge { background: #0003; border-radius: 99px; padding: 1px 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
.chip-btn { padding: 6px 12px 6px 6px; }
.chip-btn .avatar { --size: 26px; font-size: 11px; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px; align-self: center; }
.chip { border: 0; background: var(--bg); color: var(--muted); border-radius: 99px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
.chip.on { background: var(--ink); color: var(--bg); }

/* ---------- panels ---------- */
.panel {
  background: var(--bg-2);
  border: 2px solid var(--line);
  border-radius: 22px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* ---------- home ---------- */
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 18px 0 6px; gap: 10px; }
.hero-fan { position: relative; height: 128px; width: 280px; max-width: 100%; margin-bottom: 4px; }
.hero-fan .card {
  position: absolute;
  left: 50%;
  bottom: 0;
  margin-left: -34px;
  transform-origin: 50% 140%;
  rotate: calc(var(--i) * 13deg);
  animation: bob 3.2s ease-in-out infinite;
  animation-delay: calc(var(--i) * 0.18s);
  cursor: default;
}
@keyframes bob { 50% { translate: 0 -8px; } }
.logo { display: flex; flex-direction: column; align-items: center; line-height: 0.82; }
.logo-phase { font-family: var(--body); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5em; font-size: 15px; color: var(--muted); margin-right: -0.5em; }
.logo-ten {
  font-family: var(--display);
  font-size: clamp(72px, 22vw, 124px);
  color: var(--ink);
  text-shadow: 4px 4px 0 var(--red), 8px 8px 0 var(--blue), 12px 12px 0 var(--green);
  letter-spacing: 0.02em;
  margin-right: 12px;
}
.small-logo .logo-ten { font-size: 40px; text-shadow: 2px 2px 0 var(--red), 4px 4px 0 var(--blue); }
.tagline-main { color: var(--muted); max-width: 34ch; margin-top: 8px; font-weight: 500; }

.games { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.games li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: var(--surface); }
.games li .grow { display: flex; flex-direction: column; }
.code-input { text-transform: uppercase; letter-spacing: 0.3em; font-weight: 700; }

.rules summary { cursor: pointer; font-family: var(--display); font-size: 18px; list-style: none; display: flex; justify-content: space-between; }
.rules summary::after { content: "+"; color: var(--yellow); }
.rules[open] summary::after { content: "–"; }
.phase-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
.phase-list li { display: flex; gap: 10px; align-items: center; background: var(--surface); border-radius: 12px; padding: 7px 10px; }
.phase-list b { font-family: var(--display); font-weight: 400; color: var(--bg); background: var(--yellow); width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.phase-list li:nth-child(4n + 1) b { background: var(--red); color: #fff; }
.phase-list li:nth-child(4n + 2) b { background: var(--blue); color: #fff; }
.phase-list li:nth-child(4n + 3) b { background: var(--green); color: #fff; }
.rules p { color: var(--muted); max-width: 65ch; }

/* ---------- avatars & tracks ---------- */
.avatar {
  --size: 44px;
  position: relative;
  flex: none;
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background: var(--seat);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: calc(var(--size) * 0.36);
  letter-spacing: 0.02em;
  box-shadow: inset 0 -4px 0 #0003;
  text-shadow: 0 1px 0 #0004;
}
.avatar.bot svg { width: 64%; height: 64%; color: #fff; filter: drop-shadow(0 1px 0 #0004); }
.avatar.ghost { background: transparent; border: 2px dashed var(--line); color: var(--line); box-shadow: none; font-size: 22px; }
.avatar b {
  position: absolute;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 10px;
  border: 2px solid var(--bg-2);
  text-shadow: none;
}
.avatar .dealer { right: -4px; bottom: -4px; background: var(--ink); color: var(--bg); }
.avatar .skipmark { left: -4px; top: -4px; background: var(--red); color: #fff; }
.avatar .skipmark svg { width: 12px; height: 12px; }

.track { display: flex; gap: 3px; }
.track i { flex: 1; height: 6px; min-width: 6px; border-radius: 3px; background: #ffffff1c; }
.track i.done { background: var(--stripes); background-size: 400% 100%; }
.track i:nth-child(4n + 1).done { background: var(--red); }
.track i:nth-child(4n + 2).done { background: var(--blue); }
.track i:nth-child(4n + 3).done { background: var(--green); }
.track i:nth-child(4n + 4).done { background: var(--yellow); }
.track i.now:not(.done) { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink); animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.35; } }

/* ---------- lobby ---------- */
.lobby-top { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 16px 0 4px; }
.code-tiles { display: flex; gap: 8px; }
.code-tiles span {
  font-family: var(--display);
  font-size: clamp(32px, 11vw, 48px);
  width: 1.3em;
  height: 1.6em;
  border-radius: 12px;
  display: grid;
  place-items: center;
  color: #fff;
  background: var(--red);
  box-shadow: inset 0 0 0 3px #ffffffcc, 0 5px 0 var(--red-d);
  rotate: calc((var(--i) - 2) * 3deg);
}
.code-tiles span:nth-child(2) { background: var(--blue); box-shadow: inset 0 0 0 3px #ffffffcc, 0 5px 0 var(--blue-d); }
.code-tiles span:nth-child(3) { background: var(--green); box-shadow: inset 0 0 0 3px #ffffffcc, 0 5px 0 var(--green-d); }
.code-tiles span:nth-child(4) { background: var(--yellow); color: #2a1d00; box-shadow: inset 0 0 0 3px #ffffffcc, 0 5px 0 var(--yellow-d); }
.code-tiles span:nth-child(5) { background: #fff; color: var(--bg); box-shadow: inset 0 0 0 3px var(--bg-2), 0 5px 0 #b9b4e6; }

.seat-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 8px; }
.seat-grid li { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; }
.seat-grid .avatar { --size: 58px; }
.seat-grid .pop { animation: pop 0.45s cubic-bezier(0.3, 1.6, 0.5, 1) both; animation-delay: calc(var(--i) * 70ms); }
@keyframes pop { from { transform: scale(0.3); opacity: 0; } }
.add-bot { background: none; border: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); }
.add-bot .avatar.ghost { border-color: var(--yellow); color: var(--yellow); }
.add-bot:hover .avatar.ghost { background: #ffc21a1a; }
.seat-label { font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat-sub { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; min-height: 1em; }
.waiting { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-weight: 500; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--yellow); animation: hop 1s ease-in-out infinite; }
.dots i:nth-child(2) { background: var(--green); animation-delay: 0.15s; }
.dots i:nth-child(3) { background: var(--blue); animation-delay: 0.3s; }
@keyframes hop { 40% { transform: translateY(-6px); } }
.center-msg { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 80px 0; color: var(--muted); }

/* ---------- cards ---------- */
.card {
  --w: 66px;
  --face: var(--surface-2);
  --edge: var(--shadow);
  position: relative;
  width: var(--w);
  aspect-ratio: 5 / 7.4;
  flex: none;
  border: 0;
  padding: 0;
  border-radius: calc(var(--w) * 0.15);
  background: linear-gradient(155deg, #ffffff38 0%, #ffffff00 45%), var(--face);
  color: #fff;
  box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 4px #0002, 0 3px 0 var(--edge), 0 8px 18px #0006;
  cursor: pointer;
  display: grid;
  place-items: center;
  user-select: none;
  -webkit-user-select: none;
}
.card .pip { font-family: var(--display); font-size: calc(var(--w) * 0.5); line-height: 1; text-shadow: 0 3px 0 #0003; }
.card .pip svg { width: calc(var(--w) * 0.5); height: calc(var(--w) * 0.5); display: block; }
.card .corner { position: absolute; top: calc(var(--w) * 0.08); left: calc(var(--w) * 0.12); font-family: var(--display); font-size: calc(var(--w) * 0.24); line-height: 1; }
.card .tagline { position: absolute; bottom: calc(var(--w) * 0.1); font-size: 8px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.9; }
.card.c-red { --face: var(--red); --edge: var(--red-d); }
.card.c-blue { --face: var(--blue); --edge: var(--blue-d); }
.card.c-green { --face: var(--green); --edge: var(--green-d); }
.card.c-yellow { --face: var(--yellow); --edge: var(--yellow-d); color: #3a2800; }
.card.c-yellow .pip { text-shadow: 0 3px 0 #fff6; }
.card.wild { --face: #17123f; --edge: #000; }
.card.wild::before {
  content: "";
  position: absolute;
  inset: 22% 18%;
  border-radius: 50%;
  background: conic-gradient(var(--red), var(--yellow), var(--green), var(--blue), var(--red));
  filter: blur(0.5px);
}
.card.wild .pip { position: relative; color: #fff; text-shadow: 0 2px 0 #0007, 0 0 12px #0008; }
.card.skip { --face: #fff; --edge: #b9b4e6; color: var(--bg); box-shadow: inset 0 0 0 3px var(--bg), inset 0 0 0 5px #fff, 0 3px 0 var(--edge), 0 8px 18px #0006; }
.card.skip .pip { color: var(--red); text-shadow: none; }
.card:disabled { cursor: default; }

.card.small { --w: 30px; cursor: inherit; box-shadow: inset 0 0 0 2px #fff, 0 2px 0 var(--edge); border-radius: 6px; }
.card.small .pip { font-size: 15px; text-shadow: none; }
.card.small .pip svg { width: 15px; height: 15px; }
.card.small.skip { box-shadow: inset 0 0 0 2px var(--bg), 0 2px 0 var(--edge); }
.card.small.wild::before { inset: 24% 14%; }

/* ---------- game: seats ---------- */
.topbar { display: flex; justify-content: space-between; align-items: center; }
.room { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; }
.room b { color: var(--ink); letter-spacing: 0.2em; }
.seats { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 8px; }
.seat {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 10px;
  border-radius: 18px;
  background: var(--bg-2);
  border: 2px solid transparent;
  min-width: 0;
  transition: border-color 0.2s, background 0.2s;
}
.seat.active { border-color: var(--yellow); background: var(--surface); }
.seat.active .avatar { animation: ring 1.4s ease-in-out infinite; }
@keyframes ring { 0%, 100% { box-shadow: inset 0 -4px 0 #0003, 0 0 0 0 #ffc21a99; } 50% { box-shadow: inset 0 -4px 0 #0003, 0 0 0 7px #ffc21a00; } }
.seat.skipped .avatar { filter: grayscale(0.6) brightness(0.8); }
.seat-info { display: flex; flex-direction: column; gap: 5px; min-width: 0; flex: 1; }
.seat-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.you { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; background: var(--ink); color: var(--bg); padding: 1px 6px; border-radius: 99px; vertical-align: 2px; }
.seat-stats { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; align-items: center; }
.mini-hand { display: inline-flex; align-items: center; gap: 4px; }
.mini-hand::before { content: ""; width: 9px; height: 12px; border-radius: 2px; background: var(--ink); box-shadow: 3px -2px 0 -0.5px var(--muted); }
.done-chip { color: var(--green); font-weight: 700; }

/* ---------- game: mat ---------- */
.mat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 20px 12px 16px;
  border-radius: 28px;
  background: radial-gradient(ellipse at 50% 40%, #3a32a0 0%, var(--surface) 70%);
  border: 2px solid var(--line);
  box-shadow: inset 0 2px 30px #0005;
}
.piles { display: flex; gap: 26px; align-items: center; }
.deck, .discard-pile .card, .empty-slot { --w: 78px; }
.deck {
  --w: 78px;
  width: var(--w);
  aspect-ratio: 5 / 7.4;
  border: 0;
  border-radius: 12px;
  background:
    repeating-linear-gradient(45deg, #ffffff10 0 6px, transparent 6px 12px),
    linear-gradient(160deg, #2f2885, #191454);
  box-shadow: inset 0 0 0 3px #fff, 2px 2px 0 #d8d4ff, 4px 4px 0 #fff, 6px 6px 0 #d8d4ff, 8px 10px 18px #0007;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 2px;
  cursor: pointer;
  transition: transform 0.15s ease;
}
.deck-mark { font-family: var(--display); font-size: 34px; line-height: 1; background: var(--stripes); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 #0006); }
.deck-count { font-size: 11px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.deck:disabled { cursor: default; }
.deck:not(:disabled), .discard-pile .card:not(:disabled) { animation: beckon 1.5s ease-in-out infinite; }
.deck:not(:disabled):hover { transform: translateY(-4px) rotate(-2deg); }
@keyframes beckon { 50% { filter: drop-shadow(0 0 10px #ffc21acc); } }
.discard-pile { position: relative; }
.discard-pile.stacked::before, .discard-pile.stacked::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 12px;
  background: #e8e5ff;
  box-shadow: 0 4px 10px #0005;
}
.discard-pile.stacked::before { rotate: -9deg; translate: -5px 2px; }
.discard-pile.stacked::after { rotate: 6deg; translate: 4px 0; background: #d1ccff; }
.discard-pile .card { z-index: 1; rotate: -3deg; }
.empty-slot { width: var(--w); aspect-ratio: 5 / 7.4; border-radius: 12px; border: 2px dashed var(--line); color: var(--muted); display: grid; place-items: center; font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; }
.turn-pill { padding: 7px 16px; border-radius: 99px; background: var(--bg); color: var(--muted); font-weight: 700; font-size: 14px; text-align: center; }
.turn-pill.mine { background: var(--yellow); color: #2a1d00; box-shadow: 0 4px 0 var(--yellow-d); }

/* ---------- game: table ---------- */
.table { display: flex; flex-direction: column; gap: 12px; }
.table-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 4px 0; }
.owner-name { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; margin-bottom: 6px; color: var(--muted); }
.owner-name i { width: 10px; height: 10px; border-radius: 50%; background: var(--seat); }
.groups { display: flex; flex-wrap: wrap; gap: 8px; }
.group {
  position: relative;
  background: var(--bg-2);
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 8px 10px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-width: 100%;
  min-width: 0;
  text-align: left;
  cursor: default;
}
.group:disabled { opacity: 1; }
.g-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.g-cards { display: flex; flex-wrap: wrap; row-gap: 4px; padding-left: 10px; }
.g-cards .card { margin-left: -10px; }
.g-plus { display: none; }
.group.target { cursor: pointer; border-color: var(--yellow); background: var(--surface); animation: beckon 1.5s ease-in-out infinite; }
.group.target .g-plus { display: grid; place-items: center; position: absolute; top: -10px; right: -10px; width: 26px; height: 26px; border-radius: 50%; background: var(--yellow); color: #2a1d00; font-weight: 800; box-shadow: 0 3px 0 var(--yellow-d); }
.group.target:active { transform: scale(0.97); }

.log summary { cursor: pointer; color: var(--muted); font-weight: 700; font-size: 13px; }
.log ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }

/* ---------- game: dock & hand ---------- */
.dock {
  position: sticky;
  bottom: 0;
  margin: 4px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0;

<div id="app"></div>
<script>
(() => {
// Phase Ten rules engine. Pure functions over a plain JSON game state, shared by
// the browser client, the Netlify function and the artifact build. Every action
// returns a new state or throws a GameError whose message is safe to show players.

const COLORS = ["red", "blue", "green", "yellow"];
const MAX_PLAYERS = 6;
const HAND_SIZE = 10;

// Each phase is a list of groups the player must lay down together.
const PHASES = [
  [{ kind: "set", size: 3 }, { kind: "set", size: 3 }],
  [{ kind: "set", size: 3 }, { kind: "run", size: 4 }],
  [{ kind: "set", size: 4 }, { kind: "run", size: 4 }],
  [{ kind: "run", size: 7 }],
  [{ kind: "run", size: 8 }],
  [{ kind: "run", size: 9 }],
  [{ kind: "set", size: 4 }, { kind: "set", size: 4 }],
  [{ kind: "color", size: 7 }],
  [{ kind: "set", size: 5 }, { kind: "set", size: 2 }],
  [{ kind: "set", size: 5 }, { kind: "set", size: 3 }],
];

const GROUP_NAMES = { set: "set", run: "run", color: "cards of one color" };

function describePhase(phase) {
  const groups = PHASES[phase - 1];
  if (!groups) return "All phases complete";
  return groups
    .map((g) => (g.kind === "color" ? `${g.size} cards of one color` : `${g.kind === "set" ? "Set" : "Run"} of ${g.size}`))
    .join(" + ");
}

class GameError extends Error {}
const fail = (msg) => {
  throw new GameError(msg);
};

// ---------- cards ----------

function buildDeck() {
  const deck = [];
  let id = 0;
  for (const c of COLORS) {
    for (let copy = 0; copy < 2; copy++) {
      for (let n = 1; n <= 12; n++) deck.push({ id: id++, kind: "n", n, c });
    }
  }
  for (let i = 0; i < 8; i++) deck.push({ id: id++, kind: "wild" });
  for (let i = 0; i < 4; i++) deck.push({ id: id++, kind: "skip" });
  return deck;
}

function shuffle(cards, rng = Math.random) {
  const a = cards.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function cardPoints(card) {
  if (card.kind === "wild") return 25;
  if (card.kind === "skip") return 15;
  return card.n <= 9 ? 5 : 10;
}

function cardLabel(card) {
  if (card.kind === "wild") return "Wild";
  if (card.kind === "skip") return "Skip";
  return `${card.c} ${card.n}`;
}

// ---------- group validation ----------

// Returns a table group for `cards` laid as `kind` with at least `size` cards,
// or null when the cards don't form one. Every group needs one natural card so
// its number, color or position is fixed.
function makeGroup(kind, cards, size = 1) {
  if (cards.length < size || cards.some((c) => c.kind === "skip")) return null;
  const naturals = cards.filter((c) => c.kind === "n");
  if (naturals.length === 0) return null;

  if (kind === "set") {
    const n = naturals[0].n;
    if (naturals.some((c) => c.n !== n)) return null;
    return { kind, n, cards: cards.slice() };
  }

  if (kind === "color") {
    const c = naturals[0].c;
    if (naturals.some((x) => x.c !== c)) return null;
    return { kind, c, cards: cards.slice() };
  }

  if (kind === "run") {
    if (cards.length > 12) return null;
    const nums = naturals.map((c) => c.n).sort((a, b) => a - b);
    for (let i = 1; i < nums.length; i++) if (nums[i] === nums[i - 1]) return null;
    const lo = nums[0];
    const hi = nums[nums.length - 1];
    if (hi - lo + 1 > cards.length) return null; // not enough wilds to fill the gaps
    // Spare wilds extend the top end first, then the bottom once 12 is reached.
    let end = lo + cards.length - 1;
    let start = lo;
    if (end > 12) {
      start -= end - 12;
      end = 12;
    }
    const wilds = cards.filter((c) => c.kind === "wild");
    const ordered = [];
    for (let v = start; v <= end; v++) ordered.push(naturals.find((c) => c.n === v) || wilds.pop());
    return { kind, start, end, cards: ordered };
  }
  return null;
}

// Finds a way to split `cards` into the groups a phase requires, or null.
function matchPhase(phase, cards) {
  const reqs = PHASES[phase - 1];
  if (!reqs) return null;
  const total = reqs.reduce((s, r) => s + r.size, 0);
  if (cards.length !== total) return null;

  const buckets = reqs.map(() => []);
  const place = (i) => {
    if (i === cards.length) {
      const groups = reqs.map((r, k) => makeGroup(r.kind, buckets[k], r.size));
      return groups.every(Boolean) ? groups : null;
    }
    for (let k = 0; k < reqs.length; k++) {
      if (buckets[k].length >= reqs[k].size) continue;
      buckets[k].push(cards[i]);
      const found = place(i + 1);
      if (found) return found;
      buckets[k].pop();
    }
    return null;
  };
  return place(0);
}

// Adds one card to a group already on the table. Returns the updated group or null.
function extendGroup(group, card) {
  if (card.kind === "skip") return null;
  const wild = card.kind === "wild";
  if (group.kind === "set") {
    return wild || card.n === group.n ? { ...group, cards: [...group.cards, card] } : null;
  }
  if (group.kind === "color") {
    return wild || card.c === group.c ? { ...group, cards: [...group.cards, card] } : null;
  }
  if (group.kind === "run") {
    if ((wild && group.end < 12) || card.n === group.end + 1) {
      return { ...group, end: group.end + 1, cards: [...group.cards, card] };
    }
    if ((wild && group.start > 1) || card.n === group.start - 1) {
      return { ...group, start: group.start - 1, cards: [card, ...group.cards] };
    }
  }
  return null;
}

// ---------- game flow ----------

function createGame(hostId, hostName) {
  return {
    v: 1,
    seq: 0,
    status: "lobby",
    host: hostId,
    players: [newPlayer(hostId, hostName)],
    dealer: 0,
    turn: 0,
    step: "draw",
    handNo: 0,
    deck: [],
    discard: [],
    table: [],
    lastHand: null,
    winners: [],
    log: [],
  };
}

function newPlayer(id, name) {
  const clean = String(name || "").trim().slice(0, 20);
  if (!clean) fail("Enter a name to join.");
  return { id, name: clean, phase: 1, score: 0, hand: [], laid: false, skipped: false };
}

const clone = (s) => JSON.parse(JSON.stringify(s));

function log(s, text) {
  s.log.push(text);
  if (s.log.length > 30) s.log.splice(0, s.log.length - 30);
}

function finish(s) {
  s.seq += 1;
  return s;
}

function addPlayer(state, id, name) {
  if (state.players.some((p) => p.id === id)) return state;
  if (state.status !== "lobby") fail("This game has already started.");
  if (state.players.length >= MAX_PLAYERS) fail(`This game is full (${MAX_PLAYERS} players).`);
  const s = clone(state);
  const p = newPlayer(id, name);
  s.players.push(p);
  log(s, `${p.name} joined.`);
  return finish(s);
}

const BOT_NAMES = ["Robo Rita", "Sprocket", "Gizmo", "Bolt", "Chip", "Widget", "Cog"];

function addBot(state, byId) {
  if (state.status !== "lobby") fail("Bots can only join before the game starts.");
  if (byId !== state.host) fail("Only the host can add bots.");
  if (state.players.length >= MAX_PLAYERS) fail(`The table is full (${MAX_PLAYERS} players).`);
  const s = clone(state);
  const taken = new Set(s.players.map((p) => p.name));
  const name = BOT_NAMES.find((n) => !taken.has(n)) || `Bot ${s.players.length + 1}`;
  let n = 1;
  while (s.players.some((p) => p.id === `bot_${n}`)) n++;
  s.players.push({ ...newPlayer(`bot_${n}`, name), bot: true });
  log(s, `${name} (bot) sat down.`);
  return finish(s);
}

function removePlayer(state, byId, id) {
  if (state.status !== "lobby") fail("Players can only leave before the game starts.");
  if (byId !== id && byId !== state.host) fail("Only the host can remove other players.");
  const s = clone(state);
  const p = s.players.find((x) => x.id === id);
  if (!p) return state;
  s.players = s.players.filter((x) => x.id !== id);
  const humans = s.players.filter((x) => !x.bot);
  if (s.host === id && humans.length) s.host = humans[0].id;
  log(s, `${p.name} left.`);
  return finish(s);
}

function startGame(state, byId, rng = Math.random) {
  if (state.status !== "lobby") fail("The game has already started.");
  if (byId !== state.host) fail("Only the host can start the game.");
  if (state.players.length < 2) fail("You need at least 2 players to start.");
  const s = clone(state);
  s.status = "playing";
  s.dealer = Math.floor(rng() * s.players.length);
  deal(s, rng);
  return finish(s);
}

function deal(s, rng) {
  const deck = shuffle(buildDeck(), rng);
  s.handNo += 1;
  for (const p of s.players) {
    p.hand = deck.splice(0, HAND_SIZE);
    p.laid = false;
    p.skipped = false;
  }
  s.discard = [deck.pop()];
  s.deck = deck;
  s.table = [];
  s.step = "draw";
  log(s, `Hand ${s.handNo}: ${s.players[s.dealer].name} dealt.`);
  // A Skip turned up as the first discard skips the first player.
  if (s.discard[0].kind === "skip") s.players[(s.dealer + 1) % s.players.length].skipped = true;
  s.turn = s.dealer;
  advanceTurn(s);
}

function advanceTurn(s) {
  const n = s.players.length;
  let next = (s.turn + 1) % n;
  // Bounded loop: each pass clears a skip, so at most n steps.
  for (let i = 0; i < n && s.players[next].skipped; i++) {
    s.players[next].skipped = false;
    log(s, `${s.players[next].name} is skipped.`);
    next = (next + 1) % n;
  }
  s.turn = next;
  s.step = "draw";
}

function current(state, playerId, step) {
  if (state.status !== "playing") fail("No hand is in progress.");
  const idx = state.players.findIndex((p) => p.id === playerId);
  if (idx < 0) fail("You're not in this game.");
  if (idx !== state.turn) fail(`It's ${state.players[state.turn].name}'s turn.`);
  if (step && state.step !== step) {
    fail(step === "draw" ? "You've already drawn this turn." : "Draw a card first.");
  }
  return idx;
}

function draw(state, playerId, source, rng = Math.random) {
  const idx = current(state, playerId, "draw");
  const s = clone(state);
  const p = s.players[idx];
  if (source === "discard") {
    const top = s.discard[s.discard.length - 1];
    if (!top) fail("The discard pile is empty.");
    if (top.kind === "skip") fail("You can't pick up a Skip.");
    p.hand.push(s.discard.pop());
    log(s, `${p.name} took ${cardLabel(top)} from the discard pile.`);
  } else {
    if (s.deck.length === 0) {
      // Reshuffle everything but the top discard into a new draw pile.
      const top = s.discard.pop();
      s.deck = shuffle(s.discard, rng);
      s.discard = top ? [top] : [];
      if (s.deck.length) log(s, "The discard pile was reshuffled into the deck.");
    }
    if (s.deck.length === 0) fail("There are no cards left to draw. Take the discard instead.");
    p.hand.push(s.deck.pop());
    log(s, `${p.name} drew from the deck.`);
  }
  s.step = "play";
  return finish(s);
}

function takeFromHand(p, ids) {
  const cards = ids.map((id) => p.hand.find((c) => c.id === id));
  if (cards.some((c) => !c) || new Set(ids).size !== ids.length) fail("Those cards aren't in your hand.");
  p.hand = p.hand.filter((c) => !ids.includes(c.id));
  return cards;
}

function layDown(state, playerId, cardIds) {
  const idx = current(state, playerId, "play");
  const s = clone(state);
  const p = s.players[idx];
  if (p.laid) fail("You've already laid down your phase this hand.");
  const cards = takeFromHand(p, cardIds);
  const groups = matchPhase(p.phase, cards);
  if (!groups) fail(`Those cards don't make Phase ${p.phase}: ${describePhase(p.phase)}.`);
  for (const g of groups) s.table.push({ ...g, owner: p.id });
  p.laid = true;
  log(s, `${p.name} completed Phase ${p.phase}!`);
  if (p.hand.length === 0) endHand(s, idx);
  return finish(s);
}

function hit(state, playerId, cardId, groupIndex) {
  const idx = current(state, playerId, "play");
  const s = clone(state);
  const p = s.players[idx];
  if (!p.laid) fail("Lay down your own phase before adding to groups on the table.");
  const group = s.table[groupIndex];
  if (!group) fail("That group isn't on the table.");
  const [card] = takeFromHand(p, [cardId]);
  const next = extendGroup(group, card);
  if (!next) fail(`${cardLabel(card)} doesn't fit that ${GROUP_NAMES[group.kind]}.`);
  s.table[groupIndex] = next;
  const owner = s.players.find((x) => x.id === group.owner);
  log(s, `${p.name} played ${cardLabel(card)} on ${owner ? owner.name : "a"}'s ${GROUP_NAMES[group.kind]}.`);
  if (p.hand.length === 0) endHand(s, idx);
  return finish(s);
}

function discard(state, playerId, cardId, skipTargetId) {
  const idx = current(state, playerId, "play");
  const s = clone(state);
  const p = s.players[idx];
  const [card] = takeFromHand(p, [cardId]);
  s.discard.push(card);
  if (card.kind === "skip") {
    const others = s.players.filter((x) => x.id !== p.id);
    if (others.every((x) => x.skipped)) {
      log(s, `${p.name} discarded a Skip, but everyone is already skipped.`);
    } else {
      const targetId = others.length === 1 ? others[0].id : skipTargetId;
      const target = others.find((x) => x.id === targetId);
      if (!target) fail("Choose who to skip.");
      if (target.skipped) fail(`${target.name} is already being skipped. Choose someone else.`);
      target.skipped = true;
      log(s, `${p.name} discarded a Skip on ${target.name}.`);
    }
  } else {
    log(s, `${p.name} discarded ${cardLabel(card)}.`);
  }
  if (p.hand.length === 0) endHand(s, idx);
  else advanceTurn(s);
  return finish(s);
}

function endHand(s, winnerIdx) {
  const winner = s.players[winnerIdx];
  const results = s.players.map((p) => {
    const points = p.hand.reduce((sum, c) => sum + cardPoints(c), 0);
    return { id: p.id, completed: p.laid ? p.phase : null, points };
  });
  for (const p of s.players) {
    p.score += p.hand.reduce((sum, c) => sum + cardPoints(c), 0);
    if (p.laid) p.phase += 1;
  }
  s.lastHand = { handNo: s.handNo, wentOut: winner.id, results };
  log(s, `${winner.name} went out and ended hand ${s.handNo}.`);

  const done = s.players.filter((p) => p.phase > PHASES.length);
  if (done.length) {
    const best = Math.min(...done.map((p) => p.score));
    s.winners = done.filter((p) => p.score === best).map((p) => p.id);
    s.status = "finished";
    log(s, `${s.winners.map((id) => s.players.find((p) => p.id === id).name).join(" and ")} won the game!`);
  } else {
    s.status = "between";
  }
}

function nextHand(state, playerId, rng = Math.random) {
  if (state.status !== "between") fail("The current hand isn't over yet.");
  if (!state.players.some((p) => p.id === playerId)) fail("You're not in this game.");
  const s = clone(state);
  s.status = "playing";
  s.dealer = (s.dealer + 1) % s.players.length;
  deal(s, rng);
  return finish(s);
}

// Applies an action object, the shape every client sends.
function applyAction(state, playerId, action, rng = Math.random) {
  switch (action && action.type) {
    case "join":
      return addPlayer(state, playerId, action.name);
    case "leave":
      return removePlayer(state, playerId, action.playerId || playerId);
    case "addBot":
      return addBot(state, playerId);
    case "start":
      return startGame(state, playerId, rng);
    case "draw":
      return draw(state, playerId, action.source, rng);
    case "layDown":
      return layDown(state, playerId, action.cardIds || []);
    case "hit":
      return hit(state, playerId, action.cardId, action.groupIndex);
    case "discard":
      return discard(state, playerId, action.cardId, action.skipTarget);
    case "nextHand":
      return nextHand(state, playerId, rng);
    default:
      fail("Unknown action.");
  }
}

// What one player is allowed to see: their own hand, everyone's hand size,
// the top discard, and the deck size.
function viewFor(state, playerId) {
  return {
    ...state,
    deck: undefined,
    deckCount: state.deck.length,
    discard: state.discard.slice(-1),
    discardCount: state.discard.length,
    players: state.players.map((p) => ({
      ...p,
      hand: p.id === playerId ? p.hand : undefined,
      handCount: p.hand.length,
    })),
    me: playerId,
  };
}

// Computer players. A bot plays one whole turn at a time through the same engine
// actions a person uses, so it can never break a rule.

// Pause before a bot moves, so people can follow what happened.
const BOT_DELAY_MS = 1100;

function botToMove(state) {
  return state.status === "playing" && state.players[state.turn].bot === true;
}

// Every way to build one required group from `cards`, cheapest in wilds first.
function candidates(req, cards) {
  const wilds = cards.filter((c) => c.kind === "wild");
  const nat = cards.filter((c) => c.kind === "n");
  const out = [];
  const fill = (naturals) => {
    const take = naturals.slice(0, req.size);
    const need = req.size - take.length;
    if (take.length && need <= wilds.length) out.push({ cards: [...take, ...wilds.slice(0, need)], wilds: need });
  };
  if (req.kind === "set") {
    for (let n = 1; n <= 12; n++) fill(nat.filter((c) => c.n === n));
  } else if (req.kind === "color") {
    for (const color of COLORS) fill(nat.filter((c) => c.c === color));
  } else {
    for (let start = 1; start + req.size - 1 <= 12; start++) {
      const run = [];
      for (let v = start; v < start + req.size; v++) {
        const c = nat.find((x) => x.n === v);
        if (c) run.push(c);
      }
      const need = req.size - run.length;
      if (run.length && need <= wilds.length) out.push({ cards: [...run, ...wilds.slice(0, need)], wilds: need });
    }
  }
  return out.sort((a, b) => a.wilds - b.wilds).map((g) => g.cards);
}

// Cards from `hand` that make the whole phase, or null.
function findPhase(phase, hand) {
  const reqs = PHASES[phase - 1];
  if (!reqs) return null;
  const search = (k, remaining) => {
    if (k === reqs.length) return [];
    for (const group of candidates(reqs[k], remaining)) {
      const used = new Set(group.map((c) => c.id));
      const rest = search(k + 1, remaining.filter((c) => !used.has(c.id)));
      if (rest) return [...group, ...rest];
    }
    return null;
  };
  return search(0, hand);
}

// How much a card is worth keeping. Higher means keep; the lowest is discarded.
function keepScore(card, hand, me, table) {
  if (card.kind === "wild") return 100;
  if (card.kind === "skip") return -50; // always worth throwing at someone
  if (me.laid) return table.some((g) => extendGroup(g, card)) ? 50 : -cardPoints(card);
  const others = hand.filter((c) => c.id !== card.id && c.kind === "n");
  let best = 0;
  for (const req of PHASES[me.phase - 1]) {
    let v = 0;
    if (req.kind === "set") v = others.filter((c) => c.n === card.n).length * 3;
    else if (req.kind === "color") v = others.filter((c) => c.c === card.c).length;
    else {
      const nums = new Set(others.map((c) => c.n));
      if (!nums.has(card.n)) for (let d = 1; d <= 3; d++) v += (nums.has(card.n - d) ? 4 - d : 0) + (nums.has(card.n + d) ? 4 - d : 0);
    }
    best = Math.max(best, v);
  }
  return best - cardPoints(card) / 100; // between equals, dump the expensive card
}

function wantsDiscard(state, me) {
  const top = state.discard[state.discard.length - 1];
  if (!top || top.kind === "skip") return false;
  if (top.kind === "wild") return true;
  if (me.laid) return state.table.some((g) => extendGroup(g, top));
  const withTop = [...me.hand, top];
  if (!findPhase(me.phase, me.hand) && findPhase(me.phase, withTop)) return true;
  return keepScore(top, withTop, me, state.table) >= 3;
}

// The player most worth slowing down: furthest along, then lowest score.
function skipTarget(state, me) {
  const options = state.players.filter((p) => p.id !== me.id && !p.skipped);
  options.sort((a, b) => b.phase - a.phase || Number(b.laid) - Number(a.laid) || a.score - b.score);
  return options[0];
}

// Plays the current bot's whole turn and returns the new state.
function botTurn(state, rng = Math.random) {
  const id = state.players[state.turn].id;
  const me = (s) => s.players.find((p) => p.id === id);
  let s = state;

  if (s.step === "draw") s = draw(s, id, wantsDiscard(s, me(s)) ? "discard" : "deck", rng);

  if (!me(s).laid) {
    const cards = findPhase(me(s).phase, me(s).hand);
    if (cards) s = layDown(s, id, cards.map((c) => c.id));
  }

  // Add everything that fits to the table; running out of cards wins the hand.
  for (let progress = true; progress && s.status === "playing" && me(s).laid; ) {
    progress = false;
    for (const card of me(s).hand) {
      if (card.kind === "skip") continue;
      const gi = s.table.findIndex((g) => extendGroup(g, card));
      if (gi >= 0) {
        s = hit(s, id, card.id, gi);
        progress = true;
        break;
      }
    }
  }
  if (s.status !== "playing") return s;

  const hand = me(s).hand;
  const ranked = hand.slice().sort((a, b) => keepScore(a, hand, me(s), s.table) - keepScore(b, hand, me(s), s.table));
  const target = skipTarget(s, me(s));
  // A Skip with nobody left to skip is just thrown away, so prefer a real card then.
  const pick = ranked.find((c) => c.kind !== "skip" || target) || ranked[0];
  return discard(s, id, pick.id, pick.kind === "skip" && target ? target.id : undefined);
}

// botTurn with a fallback: should the strategy ever hit a rule it didn't expect,
// the bot just draws and discards so the game never stalls on its turn.
function safeBotTurn(state, rng = Math.random) {
  try {
    return botTurn(state, rng);
  } catch (e) {
    const id = state.players[state.turn].id;
    let s = state.step === "draw" ? draw(state, id, "deck", rng) : state;
    const me = s.players.find((p) => p.id === id);
    const card = me.hand.find((c) => c.kind !== "skip") || me.hand[0];
    const target = s.players.find((p) => p.id !== id && !p.skipped);
    return discard(s, id, card.id, target && target.id);
  }
}

// Phase Ten table UI. Renders whatever the transport reports and sends player
// actions back through it, so the same screen runs on the website (server
// transport) and in the Claude artifact (shared-store transport).

const esc = (v) =>
  String(v ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);

const COLOR_ORDER = { red: 0, blue: 1, green: 2, yellow: 3 };
const SEAT_COLORS = ["#ff4d5e", "#3d8bff", "#19c37d", "#ffc21a", "#b77bff", "#ff8a3d"];
const phaseSize = (phase) => (PHASES[phase - 1] || []).reduce((t, g) => t + g.size, 0);
const initials = (name) =>
  String(name || "?")
    .split(/\s+/)
    .map((w) => w[0])
    .join("")
    .slice(0, 2)
    .toUpperCase();
const reduceMotion = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const BOT_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="2.5" r="1.6" fill="currentColor"/><rect x="4" y="6.5" width="16" height="12.5" rx="4" fill="currentColor"/><circle cx="9" cy="12.5" r="2" fill="var(--seat)"/><circle cx="15" cy="12.5" r="2" fill="var(--seat)"/><path d="M1.5 11v4M22.5 11v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
const SKIP_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="3"/><path d="M6 18 18 6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>`;

function cardHtml(card, { selected = false, attrs = "", small = false, cls = "", style = "" } = {}) {
  const kind = card.kind === "n" ? `c-${card.c}` : card.kind;
  const face = card.kind === "wild" ? "W" : card.kind === "skip" ? SKIP_ICON : card.n;
  const label = card.kind === "n" ? `${card.c} ${card.n}` : card.kind === "wild" ? "Wild" : "Skip";
  const corner = card.kind === "wild" ? "W" : card.kind === "skip" ? "S" : card.n;
  // Small cards sit inside a group button, so they render as spans.
  if (small) return `<span class="card small ${kind}" aria-hidden="true"><span class="pip">${face}</span></span>`;
  return `<button type="button" class="card ${kind}${selected ? " sel" : ""} ${cls}" ${style ? `style="${style}"` : ""} ${attrs}
    aria-label="${esc(label)}" aria-pressed="${selected}">
    <span class="corner">${corner}</span><span class="pip">${face}</span>
    <span class="tagline">${card.kind === "n" ? "" : esc(label)}</span></button>`;
}

function trackHtml(p) {
  let dots = "";
  for (let i = 1; i <= 10; i++) {
    const cls = i < p.phase ? "done" : i === p.phase ? (p.laid ? "done now" : "now") : "";
    dots += `<i class="${cls}"></i>`;
  }
  const label = p.phase > 10 ? "All 10 phases complete" : `On phase ${p.phase} of 10`;
  return `<span class="track" role="img" aria-label="${label}">${dots}</span>`;
}

function avatarHtml(name, color, extra = "", bot = false) {
  return `<span class="avatar${bot ? " bot" : ""}" style="--seat:${color}">${bot ? BOT_ICON : esc(initials(name))}${extra}</span>`;
}

// Short-lived celebration effects drawn above the page.
function createFx(layer) {
  const canvas = layer.querySelector("canvas");
  const callout = layer.querySelector(".callout");
  let parts = [];
  let raf = 0;

  function confetti(amount = 140) {
    if (reduceMotion()) return;
    const w = (canvas.width = innerWidth * devicePixelRatio);
    const h = (canvas.height = innerHeight * devicePixelRatio);
    const colors = SEAT_COLORS.slice(0, 4).concat("#ffffff");
    for (let i = 0; i < amount; i++) {
      parts.push({
        x: w * (0.2 + Math.random() * 0.6),
        y: h * 0.35,
        vx: (Math.random() - 0.5) * 22 * devicePixelRatio,
        vy: (-8 - Math.random() * 16) * devicePixelRatio,
        s: (5 + Math.random() * 7) * devicePixelRatio,
        r: Math.random() * 6,
        vr: (Math.random() - 0.5) * 0.4,
        c: colors[i % colors.length],
        life: 0,
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }

  function tick() {
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    parts = parts.filter((p) => p.life < 160 && p.y < canvas.height + 40);
    for (const p of parts) {
      p.life++;
      p.vy += 0.55 * devicePixelRatio;
      p.vx *= 0.985;
      p.x += p.vx;
      p.y += p.vy;
      p.r += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.66);
      ctx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : 0;
  }

  function shout(text, tone = "") {
    callout.textContent = text;
    callout.className = `callout ${tone}`;
    void callout.offsetWidth; // restart the animation
    callout.classList.add("go");
  }

  return { confetti, shout };
}

function mountApp(root, transport) {
  const ui = { snap: { screen: "loading" }, selected: [], sort: "number", busy: false, skipPick: false, fresh: null, seen: new Set() };
  try {
    ui.sort = localStorage.getItem("p10-sort") || "number";
  } catch {}

  root.innerHTML = `<main class="wrap"></main>
    <div class="toast-layer" aria-live="assertive"></div>
    <div class="fx" aria-hidden="true"><canvas></canvas><div class="callout"></div></div>`;
  const main = root.querySelector("main");
  const toastLayer = root.querySelector(".toast-layer");
  const fx = createFx(root.querySelector(".fx"));

  function setToast(msg) {
    toastLayer.innerHTML = msg ? `<div class="toast" role="alert">${esc(msg)}</div>` : "";
    clearTimeout(setToast.t);
    if (msg) setToast.t = setTimeout(() => setToast(""), 4000);
  }

  async function run(fn) {
    if (ui.busy) return;
    ui.busy = true;
    main.classList.add("busy");
    try {
      await fn();
    } catch (e) {
      setToast(e && e.message ? e.message : "Something went wrong. Try again.");
    } finally {
      ui.busy = false;
      main.classList.remove("busy");
      // A full redraw here would cut short the animations the update just started.
      if (ui.snap.screen === "game" && ui.snap.view.status !== "lobby") refreshSelection();
      else render();
    }
  }

  // On success, clear only the selection the action used: the update can render
  // before this resolves, and the player may already have tapped new cards.
  const act = (action) => {
    const used = ui.selected.slice();
    return run(async () => {
      await transport.act(action);
      ui.selected = ui.selected.filter((id) => !used.includes(id));
      ui.skipPick = false;
    });
  };

  // Works out what changed since the last update so only new things animate.
  function diff(prev, v) {
    if (!v || v.status === "lobby") return null;
    const sameGame = prev && prev.me === v.me && prev.host === v.host && prev.status !== "lobby";
    const me = v.players.find((p) => p.id === v.me);
    const myTurn = v.status === "playing" && v.players[v.turn].id === v.me;
    if (!sameGame) return { deal: true, cards: new Set(), myTurn };
    const pme = prev.players.find((p) => p.id === prev.me);
    const f = { deal: v.handNo !== prev.handNo, cards: new Set(), events: [] };
    if (!f.deal && me.hand && pme && pme.hand) {
      for (const c of me.hand) if (!pme.hand.some((x) => x.id === c.id)) f.cards.add(c.id);
    }
    const top = v.discard[0];
    const ptop = prev.discard[0];
    f.discard = !!top && (!ptop || ptop.id !== top.id);
    if (!f.deal) {
      for (const p of v.players) {
        const pp = prev.players.find((x) => x.id === p.id);
        if (p.laid && pp && !pp.laid) f.events.push(p.id === v.me ? `Phase ${p.phase} done!` : `${p.name} made Phase ${p.phase}`);
      }
    }
    f.win = v.status === "finished" && prev.status !== "finished";
    f.handEnd = v.status === "between" && prev.status === "playing";
    f.myTurn = myTurn && !(prev.status === "playing" && prev.players[prev.turn].id === prev.me);
    const skippedMe = me.skipped && !(pme && pme.skipped);
    if (skippedMe) f.events.push("You got skipped!");
    return f;
  }

  transport.init((snap) => {
    const prev = ui.snap.view;
    const same = snap.view && prev && ui.snap.code === snap.code && prev.seq === snap.view.seq && prev.me === snap.view.me;
    ui.snap = snap;
    if (same) return; // the same update echoed back; redrawing would restart animations
    // Drop selections for cards that left the hand.
    const me = snap.view && snap.view.players.find((p) => p.id === snap.view.me);
    if (me && me.hand) ui.selected = ui.selected.filter((id) => me.hand.some((c) => c.id === id));
    ui.fresh = diff(prev, snap.view);
    render();
    celebrate(ui.fresh);
    ui.fresh = null;
  });

  function celebrate(f) {
    if (!f) return;
    if (f.win) {
      fx.confetti(260);
      return fx.shout("Winner!", "gold");
    }
    if (f.handEnd) fx.confetti(120);
    if (f.events && f.events.length) {
      fx.confetti(90);
      fx.shout(f.events[f.events.length - 1], f.events.at(-1).startsWith("You got") ? "warn" : "");
    } else if (f.myTurn) {
      fx.shout("Your turn");
      try {
        navigator.vibrate && navigator.vibrate(25);
      } catch {}
    }
  }

  // ---------- screens ----------

  function heroCards() {
    const cards = [
      { kind: "n", n: 7, c: "red" },
      { kind: "n", n: 8, c: "blue" },
      { kind: "n", n: 9, c: "green" },

      { kind: "n", n: 11, c: "yellow" },

      .map((c, i) => cardHtml(c, { attrs: "tabindex='-1' disabled", style: `--i:${i - 2}` }))

  }

                  .map(
                    (g, i) => `<li>${avatarHtml(g.hostName, SEAT_COLORS[i % SEAT_COLORS.length])}
                      <div class="grow"><strong>${esc(g.hostName)}'s table</strong>
                      <span class="muted small">${g.players}/${MAX_PLAYERS} seated · ${esc(g.code)}</span></div>
                      <button type="button" class="btn ${g.mine ? "go" : ""}" data-join="${esc(g.code)}"${g.mine ? " data-mine" : ""}>${g.mine ? "Rejoin" : "Join"}</button></li>`

            <button class="btn go" type="submit">Join</button>

        </section>`;
    return `<header class="hero">
        ${heroCards()}
        <h1 class="logo"><span class="logo-phase">Phase</span><span class="logo-ten">Ten</span></h1>
        <p class="tagline-main">Ten phases. Up to ${MAX_PLAYERS} friends. Lowest score at the finish wins.</p>
      </header>

      <p>Draw from the deck or the discard pile. If you can, lay down your whole phase at once.
      After that, add cards to any group on the table. End your turn by discarding.

      <p>The hand ends when someone runs out of cards. Everyone who laid down their phase moves up.
      Cards left in hand score: 1–9 are 5 points, 10–12 are 10, Skip 15, Wild 25.</p>`;
  }

  function lobbyHtml(v) {
    const isHost = v.host === v.me;
    const code = String(ui.snap.code || "");
    return `<section class="lobby-top">
        <p class="lbl">Room code</p>

        ${transport.shareHint ? `<p class="muted">${esc(transport.shareHint(code))}</p>` : ""}
        ${transport.shareUrl ? `<button type="button" class="btn" data-do="copy">Copy invite link</button>` : ""}
      </section>
      <section class="panel">

        <ul class="seat-grid">${v.players
          .map(
            (p, i) => `<li class="${ui.seen.has(p.id) ? "" : "pop"}" style="--i:${i}">${avatarHtml(p.name, SEAT_COLORS[i % SEAT_COLORS.length], "", p.bot)}
              <span class="seat-label">${esc(p.name)}</span>
              <span class="seat-sub">${p.bot ? "Bot" : ""}${p.id === v.host ? "Host" : ""}${p.id === v.me ? (p.id === v.host ? " · you" : "You") : ""}</span>

        ${
          isHost
            ? `<button type="button" class="btn primary big" data-do="start" ${v.players.length < 2 ? "disabled" : ""}>
                ${v.players.length < 2 ? "Waiting for a friend…" : `Deal ${v.players.length} players in`}</button>`
            : `<p class="waiting"><span class="dots"><i></i><i></i><i></i></span>Waiting for ${esc(v.players.find((p) => p.id === v.host)?.name || "the host")} to deal</p>`
        }
        <button type="button" class="link" data-do="leave">Leave table</button>
      </section>`;
  }

  function sortedHand(hand) {
    const h = hand.slice();
    const rank = (c) => (c.kind === "wild" ? 100 : c.kind === "skip" ? 200 : 0);
    if (ui.sort === "color") {
      h.sort((a, b) => rank(a) - rank(b) || COLOR_ORDER[a.c] - COLOR_ORDER[b.c] || a.n - b.n);
    } else {
      h.sort((a, b) => rank(a) - rank(b) || a.n - b.n || COLOR_ORDER[a.c] - COLOR_ORDER[b.c]);
    }
    return h;
  }

  function derive(v) {
    const me = v.players.find((p) => p.id === v.me);
    const myTurn = v.status === "playing" && v.players[v.turn].id === v.me;
    const sel = ui.selected;
    const play = myTurn && v.step === "play";
    return {
      me,
      myTurn,
      need: phaseSize(me.phase),
      selCards: sel.map((id) => me.hand.find((c) => c.id === id)).filter(Boolean),
      canDraw: myTurn && v.step === "draw",
      canLay: play && !me.laid && sel.length === phaseSize(me.phase),
      canDiscard: play && sel.length === 1,
      canHit: play && me.laid && sel.length === 1,
    };
  }

  function actionsHtml(v, d) {
    if (!d.myTurn) {
      return `<p class="hint">${v.status === "playing" ? "Tap cards to plan your phase while you wait." : ""}</p>`;
    }
    if (v.step === "draw") return `<p class="hint strong">Draw a card: tap the deck or the discard pile.</p>`;
    const skipSel = d.selCards.length === 1 && d.selCards[0].kind === "skip";
    if (ui.skipPick && skipSel && v.players.length > 2) {
      return `<div class="pick"><span class="hint strong">Skip who?</span>${v.players
        .map((p, i) =>
          p.id === v.me || p.skipped
            ? ""
            : `<button type="button" class="btn chip-btn" data-skip="${esc(p.id)}">${avatarHtml(p.name, SEAT_COLORS[i % SEAT_COLORS.length], "", p.bot)}${esc(p.name)}</button>`
        )
        .join("")}<button type="button" class="link" data-do="cancel-skip">Cancel</button></div>`;
    }
    const sel = ui.selected.length;
    return `${
      !d.me.laid
        ? `<button type="button" class="btn go" data-do="lay" ${d.canLay ? "" : "disabled"}>
            Lay down <span class="badge">${sel}/${d.need}</span></button>`
        : ""
    }
      <button type="button" class="btn danger" data-do="discard" ${d.canDiscard ? "" : "disabled"}>${skipSel ? "Play Skip" : "Discard"}</button>
      ${d.canHit ? `<span class="hint">or tap a glowing group to add it</span>` : d.me.laid ? `<span class="hint">Pick a card to add to the table or discard</span>` : ""}`;
  }

  function statusText(v, d) {
    const turnP = v.players[v.turn];
    if (v.status !== "playing") return "Hand over";
    if (!d.myTurn) return turnP.bot ? `${esc(turnP.name)} is calculating…` : `${esc(turnP.name)} is thinking…`;
    if (v.step === "draw") return "Your turn · draw";
    if (!d.me.laid) return `Your turn · Phase ${d.me.phase}, then discard`;
    return "Your turn · play cards, then discard";
  }

  function gameHtml(v) {
    const d = derive(v);
    const f = ui.fresh || { cards: new Set() };
    const top = v.discard[0];

    const seats = v.players
      .map((p, i) => {
        const active = v.status === "playing" && i === v.turn;
        const badges =
          (i === v.dealer ? `<b class="dealer" title="Dealer">D</b>` : "") +
          (p.skipped ? `<b class="skipmark" title="Skipped next turn">${SKIP_ICON}</b>` : "");
        return `<li class="seat${active ? " active" : ""}${p.id === v.me ? " me" : ""}${p.skipped ? " skipped" : ""}">
          ${avatarHtml(p.name, SEAT_COLORS[i % SEAT_COLORS.length], badges, p.bot)}
          <div class="seat-info">
            <div class="seat-name">${esc(p.name)}${p.id === v.me ? ' <span class="you">you</span>' : ""}</div>
            <div class="seat-stats"><span class="mini-hand" title="Cards in hand">${p.handCount}</span><span>${p.score} pts</span>${p.laid ? '<span class="done-chip">Phase down</span>' : ""}</div>
            ${trackHtml(p)}
          </div></li>`;
      })
      .join("");

    const owners = v.players.map((p, i) => ({ p, i })).filter(({ p }) => v.table.some((g) => g.owner === p.id));
    const table = owners.length
      ? owners
          .map(
            ({ p, i }) => `<div class="owner" style="--seat:${SEAT_COLORS[i % SEAT_COLORS.length]}">
              <p class="owner-name"><i></i>${esc(p.name)} · Phase ${p.phase}</p>
              <div class="groups">${v.table.map((g, gi) => (g.owner !== p.id ? "" : groupHtml(g, gi, d.canHit))).join("")}</div></div>`
          )
          .join("")
      : `<p class="table-empty">Completed phases land here.</p>`;

    const hand = sortedHand(d.me.hand || []);
    const n = hand.length;
    const mid = (n - 1) / 2;
    const tilt = Math.min(2.5, 20 / Math.max(n, 1));
    const handHtml = hand
      .map((c, i) => {
        const off = i - mid;
        const cls = f.deal ? "deal" : f.cards.has(c.id) ? "fresh" : "";
        const style = `--i:${i};--r:${(off * tilt).toFixed(2)}deg;--y:${(off * off * 0.7).toFixed(1)}px`;
        return cardHtml(c, { selected: ui.selected.includes(c.id), attrs: `data-card="${c.id}"`, cls, style });
      })
      .join("");

    return `<div class="topbar">
        <span class="room">Room <b>${esc(ui.snap.code)}</b> · Hand ${v.handNo}</span>
        <button type="button" class="link" data-do="leave">Leave</button>
      </div>
      <ul class="seats">${seats}</ul>
      <section class="mat">
        <div class="piles">
          <button type="button" class="deck" data-draw="deck" ${d.canDraw ? "" : "disabled"} aria-label="Draw from deck, ${v.deckCount} cards left">
            <span class="deck-mark">10</span><span class="deck-count">${v.deckCount}</span></button>
          <div class="discard-pile${v.discardCount > 1 ? " stacked" : ""}">
            ${
              top
                ? cardHtml(top, { cls: f.discard ? "land" : "", attrs: `data-draw="discard" ${d.canDraw && top.kind !== "skip" ? "" : "disabled"}` })
                : `<div class="empty-slot">Discard</div>`
            }
          </div>
        </div>
        <p class="turn-pill${d.myTurn ? " mine" : ""}" aria-live="polite">${statusText(v, d)}</p>
      </section>
      <section class="table">${table}</section>
      <details class="log"><summary>Game log</summary><ul>${v.log
        .slice(-12)
        .reverse()
        .map((l) => `<li>${esc(l)}</li>`)
        .join("")}</ul></details>
      <section class="dock${d.myTurn ? " mine" : ""}">
        <div class="dock-head">
          <span class="phase-badge" aria-hidden="true">${Math.min(d.me.phase, 10)}</span>
          <div class="grow"><p class="lbl">Your phase</p><p class="goal">${esc(describePhase(d.me.phase))}</p></div>
          <div class="sort" role="group" aria-label="Sort hand">
            <button type="button" class="chip${ui.sort === "number" ? " on" : ""}" data-sort="number">1–12</button>
            <button type="button" class="chip${ui.sort === "color" ? " on" : ""}" data-sort="color">Color</button>
          </div>
        </div>
        <div class="actions">${actionsHtml(v, d)}</div>
        <div class="hand" style="--n:${n}">${handHtml}</div>
      </section>
      ${v.status === "between" || v.status === "finished" ? resultsHtml(v) : ""}`;
  }

  function groupHtml(g, gi, canHit) {
    const label = g.kind === "set" ? `Set of ${g.n}s` : g.kind === "run" ? `Run ${g.start}–${g.end}` : `All ${g.c}`;
    return `<button type="button" class="group${canHit ? " target" : ""}" data-group="${gi}" ${canHit ? "" : "disabled"}
      aria-label="${esc(label)}${canHit ? ", add selected card" : ""}">
      <span class="g-label">${esc(label)}</span>
      <span class="g-cards">${g.cards.map((c) => cardHtml(c, { small: true })).join("")}</span>
      <span class="g-plus" aria-hidden="true">+</span></button>`;
  }

  function resultsHtml(v) {
    const last = v.lastHand;
    const seatOf = (id) => v.players.findIndex((p) => p.id === id);
    const byId = Object.fromEntries(v.players.map((p) => [p.id, p]));
    const finished = v.status === "finished";
    const standings = v.players.slice().sort((a, b) => b.phase - a.phase || a.score - b.score);
    const title = finished
      ? `${v.winners.map((id) => esc(byId[id]?.name)).join(" & ")} ${v.winners.length > 1 ? "win" : "wins"}!`
      : `${esc(byId[last.wentOut]?.name)} went out`;
    return `<div class="overlay" role="dialog" aria-modal="true" aria-label="Hand results"><div class="sheet">
        <p class="lbl">${finished ? "Game over" : `End of hand ${last.handNo}`}</p>
        <h2 class="sheet-title">${finished ? "🏆 " : ""}${title}</h2>
        <ul class="results">${standings
          .map((p) => {
            const r = last.results.find((x) => x.id === p.id) || {};
            const i = seatOf(p.id);
            return `<li class="${v.winners.includes(p.id) ? "win" : ""}">
              ${avatarHtml(p.name, SEAT_COLORS[i % SEAT_COLORS.length], "", p.bot)}
              <div class="grow"><strong>${esc(p.name)}</strong>
                <span class="r-sub ${r.completed ? "ok" : "miss"}">${r.completed ? `Made phase ${r.completed}` : "Missed the phase"} · +${r.points ?? 0}</span>
                ${trackHtml({ ...p, laid: false })}</div>
              <span class="r-total">${p.score}<small>pts</small></span></li>`;
          })
          .join("")}</ul>
        ${
          finished
            ? `<button type="button" class="btn primary big" data-do="leave">Back to the lobby</button>`
            : `<button type="button" class="btn primary big" data-do="next">Deal hand ${v.handNo + 1}</button>`
        }
      </div></div>`;
  }

  function render() {
    const s = ui.snap;
    let body;
    if (s.screen === "loading") body = `<div class="center-msg"><span class="dots"><i></i><i></i><i></i></span><p>${esc(s.message || "Loading…")}</p></div>`;
    else if (s.screen === "unavailable") body = `<section class="panel"><h1 class="logo small-logo"><span class="logo-ten">Phase Ten</span></h1><p>${esc(s.message)}</p></section>`;
    else if (s.screen === "home") body = homeHtml();
    else if (s.view.status === "lobby") body = lobbyHtml(s.view);
    else body = gameHtml(s.view);
    const focusId = document.activeElement && document.activeElement.id;
    main.className = `wrap screen-${s.screen === "game" ? (s.view.status === "lobby" ? "lobby" : "game") : s.screen}${ui.busy ? " busy" : ""}`;
    main.innerHTML = body;
    if (s.view) for (const p of s.view.players) ui.seen.add(p.id);
    if (focusId) document.getElementById(focusId)?.focus();
  }

  // Selecting cards only touches the hand, the action bar and the table targets,
  // so the lift animation plays and nothing else redraws.
  function refreshSelection() {
    const v = ui.snap.view;
    if (!v || v.status === "lobby") return render();
    const d = derive(v);
    main.querySelectorAll(".hand .card").forEach((el) => {
      const on = ui.selected.includes(Number(el.dataset.card));
      el.classList.toggle("sel", on);
      el.setAttribute("aria-pressed", on);
    });
    const actions = main.querySelector(".actions");
    if (actions) actions.innerHTML = actionsHtml(v, d);
    main.querySelectorAll(".group").forEach((el) => {
      el.classList.toggle("target", d.canHit);
      el.disabled = !d.canHit;
    });
  }

  // ---------- events ----------

  const nameValue = () => (document.getElementById("name")?.value || "").trim();

  root.addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t || t.disabled || !main.contains(t)) return;
    const d = t.dataset;
    const v = ui.snap.view;

    if (d.card !== undefined) {
      const id = Number(d.card);
      ui.selected = ui.selected.includes(id) ? ui.selected.filter((x) => x !== id) : [...ui.selected, id];
      ui.skipPick = false;
      return refreshSelection();
    }
    if (d.sort) {
      ui.sort = d.sort;
      try {
        localStorage.setItem("p10-sort", d.sort);
      } catch {}
      return render();
    }
    if (d.draw) return act({ type: "draw", source: d.draw });
    if (d.group !== undefined) return act({ type: "hit", cardId: ui.selected[0], groupIndex: Number(d.group) });
    if (d.skip) return act({ type: "discard", cardId: ui.selected[0], skipTarget: d.skip });
    if (d.kick) return act({ type: "leave", playerId: d.kick });
    if (d.join) {
      const name = nameValue();
      if (!name && d.mine === undefined) return setToast("Enter your name first.");
      return run(() => transport.joinGame(d.join, name));
    }
    switch (d.do) {
      case "create": {
        const name = nameValue();
        if (!name) return setToast("Enter your name first.");
        return run(() => transport.createGame(name));
      }
      case "start":
        return act({ type: "start" });
      case "add-bot":
        return act({ type: "addBot" });
      case "solo": {
        const name = nameValue();
        if (!name) return setToast("Enter your name first.");
        return run(async () => {
          await transport.createGame(name);
          await transport.act({ type: "addBot" });
          await transport.act({ type: "addBot" });
          await transport.act({ type: "start" });
        });
      }
      case "next":
        return act({ type: "nextHand" });
      case "lay":
        return act({ type: "layDown", cardIds: ui.selected.slice() });
      case "discard": {
        const me = v.players.find((p) => p.id === v.me);
        const card = me.hand.find((c) => c.id === ui.selected[0]);
        const canSkipSomeone = v.players.some((p) => p.id !== v.me && !p.skipped);
        if (card && card.kind === "skip" && v.players.length > 2 && canSkipSomeone) {
          ui.skipPick = true;
          return refreshSelection();
        }
        return act({ type: "discard", cardId: ui.selected[0] });
      }
      case "cancel-skip":
        ui.skipPick = false;
        return refreshSelection();
      case "copy": {
        const url = transport.shareUrl(ui.snap.code);
        const done = () => setToast("Invite link copied.");
        if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => setToast(url));
        else setToast(url);
        return;
      }
      case "leave":
        ui.selected = [];
        return run(() => transport.leave());
    }
  });

  // Keep typed text across re-renders triggered by live updates.
  root.addEventListener("input", (e) => {
    if (e.target.id === "name") ui.name = e.target.value;
    if (e.target.id === "join-code") ui.code = e.target.value;
  });

  root.addEventListener("submit", (e) => {
    if (e.target.id !== "join-form") return;
    e.preventDefault();
    const code = (document.getElementById("join-code")?.value || "").trim().toUpperCase();
    const name = nameValue();
    if (!name) return setToast("Enter your name first.");
    if (!/^[A-Z]{5}$/.test(code)) return setToast("Room codes are 5 letters.");
    run(() => transport.joinGame(code, name));
  });

  render();
}

// Artifact transport: every game is one document in the artifact's shared store
// (games/<CODE>). Each client runs the rules engine itself and saves the result,
// holding a short lease on the document so two players never write at once.
function createArtifactTransport() {
  const LETTERS = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  const STALE_MS = 6 * 60 * 60 * 1000;
  const holder = "t" + Math.random().toString(36).slice(2);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const saved = {
    get(k) {
      try {
        return localStorage.getItem(k);
      } catch {
        return null;
      }
    },
    set(k, v) {
      try {
        if (v == null) localStorage.removeItem(k);
        else localStorage.setItem(k, v);
      } catch {}
    },
  };

  let emit = () => {};
  let db = null;
  let uid = null;
  let defaultName = saved.get("p10-name") || "";
  let code = saved.get("p10-code");
  let games = [];
  let current = null; // latest game state for `code`
  let unsubGame = null;
  let botTimer = null;

  // Everyone at the table offers to play a waiting bot's turn; the lease and the
  // version check make sure only one of them actually does.
  function scheduleBot() {
    clearTimeout(botTimer);
    if (!current || !botToMove(current)) return;
    const seq = current.seq;
    const gameCode = code;
    botTimer = setTimeout(() => {
      withLease(gameCode, (s) => (s && botToMove(s) && s.seq === seq ? safeBotTurn(s) : s)).catch(() => {});
    }, BOT_DELAY_MS + Math.random() * 600);
  }

  function publish() {
    if (code && current) {
      emit({ screen: "game", code, view: viewFor(current, uid) });
      scheduleBot();
      return;
    }
    if (code) return emit({ screen: "loading", message: "Opening your game…" });
    const now = Date.now();
    const list = games
      .filter((g) => g.state && now - g.updated < STALE_MS && g.state.players.some((p) => !p.bot))
      .filter((g) => g.state.status === "lobby" || g.state.players.some((p) => p.id === uid))
      .filter((g) => g.state.status !== "finished")
      .map((g) => ({
        code: g.code,
        hostName: (g.state.players.find((p) => p.id === g.state.host) || g.state.players[0] || {}).name || "Someone",
        players: g.state.players.length,
        mine: g.state.players.some((p) => p.id === uid),
      }));
    emit({ screen: "home", defaultName, games: list });
  }

  function watchGame(next) {
    if (unsubGame) unsubGame();
    unsubGame = null;
    clearTimeout(botTimer);
    code = next;
    current = null;
    saved.set("p10-code", code);
    if (!code) return publish();
    unsubGame = db.doc("games/" + code).onSnapshot(
      (snap) => {
        const data = snap.exists ? snap.data() : null;
        if (!data || !data.state || !data.state.players.some((p) => p.id === uid)) {
          // The game is gone or we were removed from it.
          return watchGame(null);
        }
        current = data.state;
        publish();
      },
      () => watchGame(null)
    );
    publish();
  }

  // Read-modify-write under a short lease. `change` gets the current state
  // (or null) and returns the next one; engine errors propagate to the UI.
  async function withLease(gameCode, change) {
    const ref = db.doc("games/" + gameCode);
    let lease = null;
    for (let i = 0; i < 20; i++) {
      lease = await ref.acquire({ holder, ttlMs: 1500 });
      if (lease.acquired) break;
      await sleep(150 + Math.random() * 150);
    }
    if (!lease || !lease.acquired) throw new Error("The table is busy. Try again.");
    const snap = await ref.get();
    const before = snap.exists && snap.data().state ? snap.data().state : null;
    const state = change(before);
    if (state === before) return state;
    await ref.set({ code: gameCode, state, updated: Date.now() });
    return state;
  }

  function writeError(e) {
    if (e && e.code === "invalid_argument") return new Error("You can watch but not play yet. Ask the owner to invite you to this page by email as an Editor.");
    if (e && e.code === "quota_exceeded") return new Error("This page has run out of room for new games. Ask the owner to clear old ones.");
    return e;
  }

  return {
    listsGames: true,
    shareHint: () => "Friends open this same page and tap Join under Open tables.",
    async init(fn) {
      emit = fn;
      emit({ screen: "loading", message: "Connecting…" });
      const [dbApi, userApi] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      db = dbApi;
      uid = userApi ? await userApi.id() : null;
      if (!db || !uid) {
        return emit({ screen: "unavailable", message: "Sign in to claude.ai and open this page from your invite to play with friends." });
      }
      if (!defaultName && userApi) defaultName = ((await userApi.me()).name || "").split(" ")[0];
      db.collection("games")
        .orderBy("updated", "desc")
        .limit(30)
        .onSnapshot(
          (snap) => {
            games = snap.docs.map((d) => d.data());
            if (!code) publish();
          },
          () => {}
        );
      watchGame(code);
    },
    async createGame(name) {
      saved.set("p10-name", name);
      defaultName = name;
      for (let i = 0; i < 8; i++) {
        const c = Array.from({ length: 5 }, () => LETTERS[Math.floor(Math.random() * LETTERS.length)]).join("");
        let created = false;
        try {
          await withLease(c, (s) => {
            if (s) return s; // code taken, try another
            created = true;
            return createGame(uid, name);
          });
        } catch (e) {
          throw writeError(e);
        }
        if (created) return watchGame(c);
      }
      throw new Error("Couldn't create a game. Try again.");
    },
    async joinGame(c, name) {
      if (name) {
        saved.set("p10-name", name);
        defaultName = name;
      }
      try {
        await withLease(c, (s) => {
          if (!s) throw new Error("That game no longer exists.");
          return applyAction(s, uid, { type: "join", name });
        });
      } catch (e) {
        throw writeError(e);
      }
      watchGame(c);
    },
    async act(action) {
      try {
        current = await withLease(code, (s) => {
          if (!s) throw new Error("That game no longer exists.");
          return applyAction(s, uid, action);
        });
      } catch (e) {
        throw writeError(e);
      }
      publish();
    },
    async leave() {
      if (current && current.status === "lobby") {
        const leaving = code;
        await withLease(leaving, (s) => (s ? applyAction(s, uid, { type: "leave" }) : s)).catch(() => {});
      }
      watchGame(null);
    },
  };
}

mountApp(document.getElementById("app"), createArtifactTransport());
})();
</script>
