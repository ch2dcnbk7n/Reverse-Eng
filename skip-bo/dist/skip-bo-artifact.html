<title>Skip-Bo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
/* Layout: a card-room table seen from your chair. Opponents along the far
   edge, the four building piles on the felt in the middle, your stock,
   discard piles and hand at the near edge. Hairlines instead of heavy boxes;
   one typeface (Archivo) used wide for display and narrow for labels; card
   stock in the real game's printed blue / green / red, with Skip-Bo orange as
   the only accent. */
:root {
  --felt: #0d2620;
  --felt-deep: #081a16;
  --felt-lit: #14382f;
  --ink: #edf2ef;
  --muted: #8ea89f;
  --faint: #5d7a70;
  --hair: rgb(237 242 239 / 0.09);
  --hair-strong: rgb(237 242 239 / 0.18);
  --raise: rgb(237 242 239 / 0.035);
  --accent: #f2711c;
  --accent-ink: #1c0d02;
  --stock: #f6f2e9;
  --stock-edge: #ddd5c3;
  --blue: #1f5cbd;
  --green: #17824a;
  --red: #c42d37;
  --type: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  color: var(--ink);
  font: 400 15px/1.5 var(--type);
  background: radial-gradient(120% 90% at 50% 30%, var(--felt) 0%, var(--felt-deep) 75%) fixed, var(--felt-deep);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--felt-deep); z-index: 10; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
input {
  font: inherit;
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--hair-strong);
  background: rgb(0 0 0 / 0.2);
  color: var(--ink);
}
input::placeholder { color: var(--faint); }
input:focus { border-color: var(--accent); outline: none; }
button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.wrap.busy { cursor: progress; }
h1, h2 { margin: 0; font-weight: 400; text-wrap: balance; }
h2 { font-size: 13px; font-weight: 700; font-stretch: 112%; text-transform: uppercase; letter-spacing: 0.14em; display: flex; align-items: center; gap: 10px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.lbl { display: block; font-size: 11px; font-weight: 600; font-stretch: 85%; text-transform: uppercase; letter-spacing: 0.16em; color: var(--muted); margin-bottom: 6px; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; gap: 10px; align-items: flex-end; }
.count { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; }

/* ---------- buttons ---------- */
.btn {
  border: 1px solid var(--hair-strong);
  background: transparent;
  border-radius: 999px;
  min-height: 42px;
  padding: 0 20px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-decoration: none;
  transition: background 0.15s, border-color 0.15s, transform 0.1s;
}
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: #ff8435; border-color: #ff8435; }
.btn.go { background: var(--ink); border-color: var(--ink); color: var(--felt-deep); }
.btn.big { width: 100%; min-height: 52px; font-size: 14px; font-weight: 700; font-stretch: 112%; text-transform: uppercase; letter-spacing: 0.07em; }
.btn.bots svg { --seat: var(--felt); width: 18px; height: 18px; color: var(--muted); }
.web-link { border-color: var(--hair-strong); }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; text-decoration-color: var(--hair-strong); text-underline-offset: 4px; cursor: pointer; padding: 6px; align-self: center; font-size: 13px; }
.link:hover { color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--hair-strong); background: transparent; color: var(--muted); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
.chip:hover { color: var(--ink); }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--felt-deep); }

.panel { background: var(--raise); border: 1px solid var(--hair); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

/* ---------- cards ---------- */
.card {
  --w: 64px;
  --band: var(--stock-edge);
  position: relative;
  width: var(--w);
  aspect-ratio: 5 / 7;
  flex: none;
  border: 0;
  padding: 0;
  border-radius: calc(var(--w) * 0.09);
  background: linear-gradient(170deg, #fffdf8 0%, var(--stock) 60%, #ece6d8 100%);
  color: var(--band);
  box-shadow: 0 1px 0 rgb(0 0 0 / 0.35), 0 6px 16px rgb(0 0 0 / 0.32);
  display: grid;
  place-items: center;
  user-select: none;
  -webkit-user-select: none;
}
/* The printed frame line inside the card's edge. */
.card::before { content: ""; position: absolute; inset: calc(var(--w) * 0.06); border: max(1px, calc(var(--w) * 0.018)) solid var(--band); border-radius: calc(var(--w) * 0.05); opacity: 0.85; pointer-events: none; }
.card .pip { font-weight: 800; font-stretch: 112%; font-size: calc(var(--w) * 0.5); line-height: 1; letter-spacing: -0.03em; font-variant-numeric: lining-nums; }
.card .corner { position: absolute; font-weight: 700; font-stretch: 80%; font-size: calc(var(--w) * 0.17); line-height: 1; padding: 0 2px; background: inherit; }
.card .corner.tl { top: calc(var(--w) * 0.02); left: calc(var(--w) * 0.08); }
.card .corner.br { bottom: calc(var(--w) * 0.02); right: calc(var(--w) * 0.08); transform: rotate(180deg); }
.card .corner { background: #fbf8f1; }
.card.u .pip, .card.u .corner { text-decoration: underline; text-decoration-thickness: 0.08em; text-underline-offset: 0.06em; }
.card.c-blue { --band: var(--blue); }
.card.c-green { --band: var(--green); }
.card.c-red { --band: var(--red); }
.card.wild { --band: #fff; background: linear-gradient(170deg, #ff8a3d 0%, var(--accent) 55%, #d85a0d 100%); color: #fff; }
.card.wild::before { border-color: rgb(255 255 255 / 0.75); }
.card .sb { display: flex; flex-direction: column; align-items: center; line-height: 0.95; transform: rotate(-90deg); }
.card .sb b { font-weight: 800; font-stretch: 125%; font-size: calc(var(--w) * 0.19); text-transform: uppercase; letter-spacing: 0.06em; }
.card .as { position: absolute; bottom: calc(var(--w) * 0.1); right: calc(var(--w) * 0.1); font-weight: 800; font-size: calc(var(--w) * 0.18); color: var(--accent); background: #fff; border-radius: 4px; min-width: 1.5em; text-align: center; padding: 0 0.15em; line-height: 1.35; }
.card.back { background: repeating-linear-gradient(135deg, rgb(255 255 255 / 0.05) 0 2px, transparent 2px 7px), linear-gradient(170deg, #1a4a3e, #0e2c25); }
.card.back::before { border-color: var(--accent); opacity: 0.7; }
.card.back .sb b { color: var(--accent); }
.card.mini { --w: 30px; box-shadow: 0 1px 2px rgb(0 0 0 / 0.4); }
.card.mini::before, .card.tiny::before { inset: 2px; border-width: 1px; }
.card.mini .corner, .card.tiny .corner, .card.tiny .as { display: none; }
.card.mini .pip { font-size: calc(var(--w) * 0.48); }
.card.mini.wild .sb b, .card.tiny.wild .sb b { font-size: 5px; letter-spacing: 0; }
.card.tiny { --w: 20px; display: inline-grid; vertical-align: middle; box-shadow: none; margin: 0 3px; }
.card.tiny .pip { font-size: 11px; }
.slot { width: var(--w, 64px); aspect-ratio: 5 / 7; border-radius: calc(var(--w, 64px) * 0.09); border: 1px dashed var(--hair-strong); display: grid; place-items: center; color: var(--faint); font-weight: 700; font-stretch: 112%; font-size: calc(var(--w, 64px) * 0.32); }
.slot.mini { --w: 30px; border-radius: 3px; font-size: 0; }

/* A card flying across the table, or following your finger. */
.fly { position: absolute; z-index: 31; pointer-events: none; will-change: transform; }
.fly .card { --w: inherit; }
.fly.dragging { z-index: 40; }
.fly.dragging .card { transform: rotate(-3deg) scale(1.06); box-shadow: 0 0 0 2px var(--accent), 0 18px 34px rgb(0 0 0 / 0.55); }
.lifted { opacity: 0.3; }

/* ---------- home ---------- */
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 26px 0 6px; gap: 10px; }
.hero-fan { position: relative; height: 128px; width: 260px; max-width: 100%; margin-bottom: 18px; }
.hero-fan .card { --w: 66px; position: absolute; left: 50%; bottom: 0; margin-left: -33px; transform-origin: 50% 150%; rotate: calc(var(--i) * 11deg); }
.kicker { font-size: 11px; font-weight: 600; font-stretch: 85%; letter-spacing: 0.24em; text-transform: uppercase; color: var(--accent); }
.logo { font-weight: 900; font-stretch: 125%; font-size: clamp(46px, 14vw, 84px); line-height: 0.95; letter-spacing: -0.02em; text-transform: uppercase; color: var(--ink); }
.small-logo { font-size: 32px; }
.tagline-main { color: var(--muted); max-width: 40ch; margin-top: 6px; }
.games { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.games li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--hair); }
.games li:first-child { border-top: 0; padding-top: 0; }
.games li .grow { display: flex; flex-direction: column; }
.code-input { text-transform: uppercase; letter-spacing: 0.3em; font-weight: 700; }
.rules summary { cursor: pointer; font-size: 13px; font-weight: 700; font-stretch: 112%; text-transform: uppercase; letter-spacing: 0.14em; list-style: none; display: flex; justify-content: space-between; }
.rules summary::after { content: "+"; color: var(--muted); font-weight: 400; }
.rules[open] summary::after { content: "−"; }
.rule-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rule-list li { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--hair); }
.rule-list b { font-size: 11px; font-weight: 700; font-stretch: 85%; text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent); padding-top: 2px; }
.rule-list span { color: var(--muted); max-width: 60ch; }

/* ---------- avatars ---------- */
.avatar {
  --size: 36px;
  position: relative;
  flex: none;
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background: color-mix(in srgb, var(--seat) 26%, transparent);
  box-shadow: inset 0 0 0 1.5px var(--seat);
  color: var(--ink);
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: calc(var(--size) * 0.36);
}
.avatar.bot svg { width: 58%; height: 58%; color: var(--seat); }
.avatar.bot svg circle[fill="var(--seat)"] { fill: var(--felt-deep); }
.avatar.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--hair-strong); color: var(--faint); font-size: 20px; font-weight: 300; }

/* ---------- lobby ---------- */
.lobby-top { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 18px 0 4px; }
.code-tiles { display: flex; gap: 6px; }
.code-tiles span { width: 1.5em; height: 1.8em; display: grid; place-items: center; border: 1px solid var(--hair-strong); border-radius: 8px; font-weight: 800; font-stretch: 118%; font-size: clamp(26px, 8vw, 38px); background: var(--raise); }
.seat-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 8px; }
.seat-grid li { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.seat-grid .avatar { --size: 52px; }
.seat-grid .pop { animation: pop 0.4s cubic-bezier(0.3, 1.4, 0.5, 1) both; animation-delay: calc(var(--i) * 60ms); }
@keyframes pop { from { transform: scale(0.6); opacity: 0; } }
.seat-label { font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat-sub { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.14em; min-height: 1em; }
.add-bot { background: none; border: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--muted); }
.add-bot .avatar.ghost { box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent); }
.add-bot:hover { color: var(--ink); }
.option { display: flex; flex-direction: column; gap: 2px; padding-top: 14px; border-top: 1px solid var(--hair); }
.waiting { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: hop 1.1s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: 0.15s; }
.dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes hop { 40% { opacity: 0.25; } }
.center-msg { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 80px 0; color: var(--muted); }
.lost { margin-top: 18vh; text-align: center; }
.lost h2 { justify-content: center; }
.lobby-foot { display: flex; justify-content: center; align-items: center; gap: 16px; }

/* ---------- game layout: one screen, nothing scrolls under your hand ---------- */
.wrap.screen-game {
  max-width: 820px;
  height: 100vh;
  height: 100dvh;
  padding-block: 10px 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  gap: 10px;
  overflow: hidden;
}
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.topbar .room { flex: 1; min-width: 0; }
.room { font-size: 11px; font-weight: 600; font-stretch: 85%; color: var(--muted); text-transform: uppercase; letter-spacing: 0.16em; }
.room b { color: var(--ink); font-weight: 700; letter-spacing: 0.24em; }
.offline { margin-left: 8px; color: var(--accent); animation: hop 1.4s ease-in-out infinite; }
.tune-switch { display: inline-flex; align-items: center; gap: 7px; background: none; border: 0; padding: 4px; cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 600; font-stretch: 85%; letter-spacing: 0.16em; text-transform: uppercase; }
.tune-switch .track { width: 28px; height: 16px; border-radius: 99px; box-shadow: inset 0 0 0 1px var(--hair-strong); position: relative; transition: background 0.2s; }
.tune-switch .knob { position: absolute; top: 3px; left: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); transition: transform 0.2s, background 0.2s; }
.tune-switch.on { color: var(--ink); }
.tune-switch.on .track { background: var(--accent); box-shadow: none; }
.tune-switch.on .knob { transform: translateX(12px); background: var(--accent-ink); }

/* Opponents along the far edge */
.opps { list-style: none; margin: 0; padding: 0 0 2px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.opps::-webkit-scrollbar { display: none; }
.opp { flex: 1 0 170px; border: 1px solid var(--hair); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 7px; min-width: 0; background: var(--raise); transition: border-color 0.2s; }
.opp.active { border-color: var(--accent); }
.opp-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.opp-head .avatar { --size: 22px; font-size: 9px; }
.opp-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 600; }
.opp.active .opp-name::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: 2px; animation: hop 1.4s ease-in-out infinite; }
.opp-hand { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.opp-hand::before { content: ""; width: 8px; height: 11px; border-radius: 2px; border: 1px solid var(--muted); }
.opp-piles { display: flex; align-items: center; gap: 10px; }
.mini-stock { position: relative; display: flex; align-items: center; gap: 5px; }
.mini-stock b { font-size: 12px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.mini-discards { display: flex; gap: 3px; padding-left: 10px; border-left: 1px solid var(--hair); }

/* The felt in the middle */
.center {
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: safe center;
  gap: 14px;
  padding: 14px;
  border-radius: 22px;
  background: radial-gradient(ellipse 80% 70% at 50% 45%, var(--felt-lit) 0%, transparent 80%);
  border: 1px solid var(--hair);
}
.center-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; }
.center-mid { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.dir-tag { font-size: 10px; font-weight: 600; font-stretch: 85%; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); }
.draw-pile, .done-pile { display: flex; flex-direction: column; align-items: center; font-size: 18px; font-weight: 700; font-stretch: 112%; line-height: 1; color: var(--ink); min-width: 56px; font-variant-numeric: tabular-nums; }
.draw-pile small, .done-pile small { font-size: 9px; font-weight: 600; font-stretch: 85%; color: var(--muted); letter-spacing: 0.16em; text-transform: uppercase; margin-top: 5px; }
.turn-pill { padding: 7px 16px; border-radius: 999px; border: 1px solid var(--hair-strong); color: var(--muted); font-weight: 600; font-size: 13px; text-align: center; }
.turn-pill.mine { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.builds { display: flex; gap: 14px; justify-content: center; }
.build { --w: 72px; background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: default; border-radius: 10px; }
.build .card, .build .slot { --w: inherit; transition: transform 0.15s, box-shadow 0.15s; }
.build .need { font-size: 10px; font-weight: 600; font-stretch: 85%; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
.build.ok { cursor: pointer; }
.build.ok .card, .build.ok .slot { box-shadow: 0 0 0 2px var(--accent), 0 8px 20px rgb(0 0 0 / 0.4); animation: beckon 1.6s ease-in-out infinite; }
.build.ok .slot { border-color: transparent; color: var(--accent); }
.build.ok .need { color: var(--accent); }
.build.no { opacity: 0.4; }
.build.hover .card, .build.hover .slot { transform: translateY(-4px); }
@keyframes beckon { 50% { box-shadow: 0 0 0 2px var(--accent), 0 0 0 7px rgb(242 113 28 / 0.18), 0 8px 20px rgb(0 0 0 / 0.4); } }
.move-note { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); max-width: 100%; line-height: 1.6; }
.move-note > span:last-child { color: var(--ink); }
.move-note .src { flex: none; font-size: 9px; font-weight: 600; font-stretch: 85%; letter-spacing: 0.16em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid var(--hair-strong); color: var(--muted); }
.move-note .src-stock { border-color: var(--accent); color: var(--accent); }

/* Your edge of the table */
.dock {
  position: relative;
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, rgb(8 26 22 / 0.92), var(--felt-deep));
  border-top: 1px solid var(--hair-strong);
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 5;
}
.dock.mine { border-top-color: var(--accent); }
.dock-row { display: flex; align-items: flex-end; gap: 18px; justify-content: center; }
.my-stock, .my-discard { --w: 56px; position: relative; background: none; border: 0; padding: 0; display: grid; justify-items: center; cursor: pointer; }
.my-stock .card, .my-stock .slot, .my-discard .card, .my-discard .slot { --w: inherit; grid-area: 1 / 1; transition: translate 0.15s, box-shadow 0.15s; }
.my-stock { --w: 66px; }
.my-stock .stack-edge { grid-area: 1 / 1; width: var(--w); aspect-ratio: 5 / 7; border-radius: calc(var(--w) * 0.09); background: var(--stock-edge); translate: 3px 3px; box-shadow: 3px 3px 0 #b8ae97, 0 6px 14px rgb(0 0 0 / 0.3); }
.pile-label { font-size: 9px; font-weight: 600; font-stretch: 85%; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-top: 10px; }
.count-badge { position: absolute; top: -7px; right: -7px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px; background: var(--felt-deep); border: 1px solid var(--hair-strong); font-size: 10px; font-weight: 700; display: grid; place-items: center; z-index: 2; font-variant-numeric: tabular-nums; }
.stock-count { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 11px; }
